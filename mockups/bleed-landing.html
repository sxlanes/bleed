<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bleed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23cb1b22'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /* Bleed — a wall of arterial red. White type, one white cut down the left.
     Single committed world: no light mode, no dark mode. It is the wound. */
  :root {
    --red:      #cb1b22;
    --red-deep: #8e1013;
    --white:    #ffffff;
    --white-2:  #f6dedf;   /* white carrying a whisper of the red */

    --display: "Anton", "Haettenschweiler", "Arial Narrow", sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;

    --rail: clamp(1.25rem, 5.5vw, 4rem);
    --pad:  clamp(3.5rem, 13vw, 9.5rem);
    --edge: clamp(1.25rem, 5vw, 3rem);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--red);
    color: var(--white);
    font-family: var(--mono);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  ::selection { background: var(--white); color: var(--red); }

  /* the cut — white on red now */
  .rail {
    position: fixed;
    inset: 0 auto 0 var(--rail);
    width: 2px;
    background: linear-gradient(180deg, var(--white) 0%, rgba(255,255,255,0.65) 60%, rgba(255,255,255,0) 100%);
    transform: scaleY(0);
    transform-origin: top;
    animation: draw 780ms cubic-bezier(0.65,0,0.35,1) both;
    z-index: 3;
  }
  .rail::after {
    content: "";
    position: absolute;
    top: 0; left: -4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--white);
    animation: beat 1.7s ease-in-out 950ms infinite;
  }

  #ambient {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
  }

  .shell {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(1.75rem,4vw,2.5rem) var(--edge) clamp(1.75rem,4vw,2.5rem) var(--pad);
    max-width: 76rem;
  }

  .mark {
    font-family: var(--display);
    font-size: 1.4rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    animation: rise 560ms ease-out 160ms both;
  }

  main {
    align-self: center;
    padding: clamp(2rem,6vw,4rem) 0;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    margin: 0 0 clamp(2.25rem, 6vw, 3.5rem);
    line-height: 0.88;
    letter-spacing: 0.012em;
    text-transform: uppercase;
    font-size: clamp(3.1rem, 13vw, 8.5rem);
    text-wrap: balance;
  }
  h1 span { display: block; animation: rise 660ms cubic-bezier(0.2,0.7,0.2,1) both; }
  h1 .a { animation-delay: 280ms; }
  h1 .b {
    animation-delay: 360ms;
    /* the word bleeds out: white at the top, gone into the red at the foot */
    background: linear-gradient(179deg, var(--white) 8%, rgba(255,255,255,0.62) 48%, rgba(255,255,255,0.08) 96%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: rgba(255,255,255,0.6);
  }

  form {
    display: flex;
    max-width: 40rem;
    border: 1.5px solid rgba(255,255,255,0.55);
    background: transparent;
    animation: rise 660ms ease-out 480ms both;
  }
  form:focus-within { border-color: var(--white); }

  .c {
    display: flex;
    align-items: center;
    padding: 0 0.9rem;
    color: var(--white);
    border-right: 1.5px solid rgba(255,255,255,0.28);
    user-select: none;
  }

  input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--white);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 1.05rem 0.95rem;
  }
  input::placeholder { color: rgba(255,255,255,0.66); }
  input:focus { outline: 0; }

  button {
    flex: 0 0 auto;
    border: 0;
    background: var(--white);
    color: var(--red);
    font-family: var(--mono);
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0 1.6rem;
    cursor: pointer;
    transition: background 130ms linear, color 130ms linear;
  }
  button:hover { background: var(--white-2); }
  button:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  footer {
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    animation: rise 560ms ease-out 640ms both;
  }

  @keyframes draw { to { transform: scaleY(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: none; } }
  @keyframes beat {
    0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
    45%      { transform: scale(1.18); opacity: 0.8; box-shadow: 0 0 0 7px rgba(255,255,255,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rail { animation: none; transform: scaleY(1); }
    .rail::after { animation: none; }
    .mark, h1 span, form, footer { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="rail" aria-hidden="true"></div>
<canvas id="ambient" aria-hidden="true"></canvas>

<div class="shell">
  <span class="mark">Bleed</span>

  <main>
    <h1>
      <span class="a">Your site is</span>
      <span class="b">bleeding.</span>
    </h1>

    <form id="audit">
      <span class="c" aria-hidden="true">&#9615;</span>
      <label for="url" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Restaurant website</label>
      <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="paste a restaurant website" />
      <button type="submit">Run</button>
    </form>
  </main>

  <footer>leak audit &middot; M&aacute;laga</footer>
</div>

<script>
  (function () {
    "use strict";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var canvas = document.getElementById("ambient");
    var ctx = null;
    try { ctx = canvas.getContext("2d"); } catch (e) {}
    if (ctx) {
      var w, h, lines;
      function seed() {
        var dpr = window.devicePixelRatio || 1;
        w = canvas.width = canvas.offsetWidth * dpr;
        h = canvas.height = canvas.offsetHeight * dpr;
        var n = Math.round(Math.min(26, w / 70));
        lines = [];
        for (var i = 0; i < n; i++) {
          lines.push({
            x: Math.pow(Math.random(), 1.7) * w,
            y: Math.random() * h,
            len: 26 + Math.random() * 100,
            v: 0.12 + Math.random() * 0.7,
            a: 0.05 + Math.random() * 0.12
          });
        }
      }
      function draw(move) {
        ctx.clearRect(0, 0, w, h);
        ctx.lineWidth = 1;
        for (var i = 0; i < lines.length; i++) {
          var s = lines[i];
          var g = ctx.createLinearGradient(s.x, s.y, s.x, s.y + s.len);
          g.addColorStop(0, "rgba(255,255,255,0)");
          g.addColorStop(0.5, "rgba(255,255,255," + s.a + ")");
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.strokeStyle = g;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x, s.y + s.len);
          ctx.stroke();
          if (move) {
            s.y += s.v;
            if (s.y > h + s.len) { s.y = -s.len; s.x = Math.pow(Math.random(), 1.7) * w; }
          }
        }
      }
      seed();
      draw(false);
      if (!reduce) { (function anim(){ draw(true); requestAnimationFrame(anim); })(); }
      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () { seed(); draw(!reduce); }, 200);
      });
    }

    document.getElementById("audit").addEventListener("submit", function (e) {
      e.preventDefault();
    });
  })();
</script>
</body>
</html>
